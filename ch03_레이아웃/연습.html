<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
         }
         .container {
            width: 1000px;
            height: 700px;
         }
        .header {
            background-color: navy;
            width: 100%;
            height: 80px;
        }
        .nav {
            background-color: skyblue;
            width: 100%;
            height: 40px;
        }
        .body-wrap {
            display: flex;
            height: 480px;
            width: 100%;
            outline: 3px solid orange
        }
        .body-wrap .main {
            width: 60%;
        }
        .body-wrap .main .main-top {
            background-color: white;
            height: 300px;
        }
        .body-wrap .main .main-bottom {
            height: 180px;
            background-color: lightgray;
        }
        .body-wrap .left {
            width: 20%;
            height: 480px;
            background-color: lightgreen;
        }
        .body-wrap .right {
            width: 20%;
            height: 480px;
            background-color: pink;
        }
        .footer {
            height: 100px;
            background-color: gray;
        }
        
    </style>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="nav"></div>
        <div class="body-wrap">
            <div class="left"></div>
            <div class="main">
                <div class="main-top"></div>
                <div class="main-bottom"></div>
            </div>
            <div class="right"></div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
