<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            background-color: aqua;
            color: white;
            display: inline-block;
            padding: 5px;
            margin: 50px;
            font-size: 32px;
            transform: scale(0.5, 2);
            transform: skew(20deg);
            transform: rotate(50deg);
        }
        .container {
            height: 100px;
            border: 4px solid black;
        }
        .container .item {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: wheat;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 1s;

        }
        .container .item:hover {
            transform: rotate(50deg);
            border-radius: 60%;
            background-color: orange;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Hello Transform</h1>
    <div class="container">
        <div class="item">
            transition
        </div>
    </div>
</body>
</html>
