<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 100px;
            border: 4px solid black;
        }
        .container .item {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: aliceblue;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transform: 
                translateX(50px)
                translateY(50px)
                rotate(45deg)
                scale(1.5);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">box</div>
    </div>
</body>
</html>
